[package]
name = "snarkrs-witness"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The circom wasm calculator. Off, the crate is the native-binary runner alone and links no
# wasm runtime at all.
default = ["wasm"]
wasm = ["dep:wasmtime"]

[dependencies]
snarkrs-field.workspace = true
snarkrs-formats.workspace = true
ark-ff.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Scrubs the byte images of a witness. Already in the tree through snarkrs-formats.
zeroize = "1.9"

# 34.0.2 is the newest wasmtime whose rust-version (1.85) the workspace's allows; 35 and up
# need 1.86. No default features: Cranelift to compile the module, the runtime to run it,
# `std`, and rayon-backed parallel compilation, which is what a 10 MB circuit wasm needs.
# No WASI, component model, cache, profiling, async or GC: a circom module imports four
# host functions and nothing else, and the sandbox gets nothing beyond them.
wasmtime = { version = "34.0.2", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "parallel-compilation",
] }
