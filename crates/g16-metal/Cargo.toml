[package]
name = "g16-metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
g16-field.workspace = true
g16-zkey.workspace = true
g16-core.workspace = true
# Direct because `ceremony` implements three of its traits. It was already here through
# g16-core, and a transitive presence is not a version constraint.
g16-msm.workspace = true
# Direct for the same reason: the FFT packs and unpacks its blocks on the pool. Already
# here through g16-core.
rayon.workspace = true
# The GLV twiddle layout and decomposition, shared with g16-cuda so the two FFT drivers
# feed their kernels bit-identical tables. Everything else in layout.rs stays this
# crate's own copy.
g16-gpu-layout.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

[dev-dependencies]
# The CPU reference the ceremony kernels are tested against: `prepare::point_times_fr`,
# `prepare::batch_to_affine` and `CpuKeyScale` are the implementations `--backend cpu`
# runs, and byte-identity with snarkjs rests on them. No cycle: g16-ceremony does not
# depend on this crate.
g16-ceremony.workspace = true

[features]
default = []

[lints.rust]
# objc 0.2's `sel_impl!` expands to a `cfg(feature = "cargo-clippy")` test, which stopped
# being a real cfg in Rust 1.78. Declaring it expected keeps the lint on for everything
# else rather than switching it off crate-wide; the selector calls in src/cb.rs are the
# only place the macro is used.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
