[package]
name = "snarkrs-ceremony"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Scrubs the contributor's toxic waste when it is dropped. Already in the tree through
# ark-ff, which implements `Zeroize` for `Fr`; declared because this crate calls it.
zeroize = "1.9"
snarkrs-field.workspace = true
snarkrs-formats.workspace = true
snarkrs-msm.workspace = true
snarkrs-ntt.workspace = true
ark-bn254.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
ark-serialize.workspace = true
byteorder.workspace = true
thiserror.workspace = true
serde_json.workspace = true
rayon.workspace = true
blake2.workspace = true
sha2.workspace = true
rand_chacha.workspace = true

# Not target gated the way snarkrs-formats's is. That crate compiles for wasm32 because the
# browser proves; this one reads and writes multi-gigabyte ceremony files by path, so
# there is no wasm target to keep a filesystem API out of.
memmap2.workspace = true

[dev-dependencies]
# The Metal ceremony seams, which the `*_metal.rs` tests hold the CPU ones against.
# snarkrs-metal dev-depends on this crate for the same reason; a dev-dependency in both
# directions is not a cycle, because neither library depends on the other.
snarkrs-metal.workspace = true
# The CUDA GroupFft, for tests/prepare_cuda.rs. `features = ["cuda"]` because the crate
# compiles to an empty shell without it; cudarc's dynamic-loading keeps this buildable
# on machines with no CUDA installed, so unlike the backend crates it need not be
# optional here.
snarkrs-cuda = { workspace = true, features = ["cuda"] }

[features]
default = []
# Compiles the cpu-against-metal comparisons under `tests/`. Off by default because they
# need a Metal device, and a machine without one would report a failure where it should
# report nothing.
metal = []
# Same for the cpu-against-cuda comparisons; these skip loudly with no NVIDIA device.
cuda = []
