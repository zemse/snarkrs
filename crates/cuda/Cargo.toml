[package]
name = "snarkrs-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
# `prove_with_blinders`, for the tests that compare proofs bit for bit at pinned blinders.
# Dev-only, so the feature never reaches a shipping build of this crate.
snarkrs-groth16 = { workspace = true, features = ["deterministic-blinders"] }

[features]
# Off by default so a macOS workspace build never needs CUDA. With the feature on, this
# crate COMPILES anywhere (cudarc's dynamic-loading feature dlopens libcuda/libnvrtc at
# run time rather than linking them), and only RUNNING needs an NVIDIA GPU. That is what
# lets the backend be developed and typechecked on the M2 Max.
cuda = ["dep:cudarc"]

[dependencies]
snarkrs-field.workspace = true
snarkrs-formats.workspace = true
snarkrs-groth16.workspace = true
snarkrs-gpu-layout.workspace = true
snarkrs-gpu-kernels.workspace = true
# Direct because `ceremony` implements one of its traits, the same reason snarkrs-metal
# declares it.
snarkrs-msm.workspace = true
# Direct because the FFT packs and unpacks its blocks on the pool, as the Metal twin
# does.
rayon.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
thiserror.workspace = true
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "driver",
    "nvrtc",
    "cuda-12080",
    "dynamic-loading",
    "std",
] }
