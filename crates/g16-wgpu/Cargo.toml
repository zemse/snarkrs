[package]
name = "g16-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# rlib only, and the `cdylib` that was here until U11 is not coming back to this crate.
#
# Cargo drops `-C extra-filename` for any lib target whose crate-type list contains cdylib, so
# that the shared object has a predictable name. That makes the *rlib* unhashed too, because
# both crate types come out of one rustc invocation. The workspace release profile sets
# `panic = "abort"` and a test harness needs `unwind`, so every library in a
# `cargo test --workspace --release` is built twice, and those two units then wrote the same
# `target/release/deps/libg16_wgpu.rlib`. Cargo says so ("output filename collision", cargo
# issue 6313, "this may become a hard error") and the effect was not a warning: with
# `g16-wgpu` in `g16-cli`'s default features, `cargo build --workspace --release --tests`
# failed 5 times out of 5 with `can't find crate for g16_cli`.
#
# U13's browser entry point needs `cdylib` plus wasm-bindgen, js-sys and web-sys, none of
# which belong in the native dependency tree. It gets its own thin wrapper crate, which is
# where wasm-pack should have been pointed anyway. See TASKS.md.
crate-type = ["rlib"]

[dependencies]
# The modulus and n0 for both fields come from here at run time, so there is no second copy
# in shader source to drift. See src/gen/field.rs.
g16-gpu-layout.workspace = true
# Only for `ProveError`, so the device layer already reports failures in the shape U11's
# `Backend` impl has to return. Builds for wasm32 unmodified, checked with
# `cargo build --target wasm32-unknown-unknown -p g16-core`.
g16-core.workspace = true
# `Coefficients`, the sorted CSR of zkey section 4, is stage 0's input. Reached through
# `g16-core`'s re-export until now, which is exactly the transitive dependency the house
# rules forbid: g16-core is free to stop re-exporting it.
g16-zkey.workspace = true
# `Fr`. The gather packs and unpacks Montgomery limbs, which is arkworks' own representation.
g16-field.workspace = true
# `AdditiveGroup::double_in_place`, for the Horner tail of an MSM. Reached through g16-field
# until now, which is exactly the transitive dependency the house rules forbid: g16-field
# re-exports seven ark-ff traits and this is not one of them.
ark-ff.workspace = true
# `UniformRand` and the `rand` re-export, for stage 10's blinders in `src/wasm.rs`, and
# `test_rng`/`UniformRand` in the tests. Not optional even though only the wasm feature calls
# it: it is already in the native tree through ark-ff and ark-ec, so declaring it costs one
# line and no compile time, and a dependency the code names directly is one the manifest
# should name too.
ark-std.workspace = true
# `current_num_threads()` only, in `src/wasm.rs`, so the browser's CPU control row can say on
# its own face how many threads it had. It is already in the tree through g16-core; declared
# here because this crate names it. On wasm32 the answer is 1: rayon-core cannot spawn a
# thread there and falls back to a pool that runs on the caller.
rayon.workspace = true
bytemuck = { version = "1", features = ["derive"] }
# The readback channel. `default-features = false` on purpose: flume's default set pulls
# `eventual-fairness`, which pulls nanorand, which pulls getrandom 0.2, which panics at run
# time on wasm32 unless the `js` feature is on. Only the async receiver is used.
flume = { version = "0.11", default-features = false, features = ["async"] }
# `std::time::Instant::now()` panics at run time on wasm32-unknown-unknown. web-time is
# `performance.now()` there and a re-export of `std::time` everywhere else, so the pipeline
# timing needs no target cfg. wgpu already pulls it on wasm; declared here because we call it.
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.1", features = ["wgsl"] }
# `src/backend.rs` only. `g16_core::PreparedCircuit` is a synchronous trait and every wgpu
# readback is asynchronous, so something has to block; on native `pollster::block_on` blocks
# a thread while `device.poll` drives the queue, which is what the readback needs. It is in
# this target table and `mod backend` is `cfg`-gated the same way, because on wasm32 pollster
# compiles and then hangs the tab: its executor is `thread::park` in a loop and the browser
# event loop never runs.
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No default features: on wasm the only backend is `webgpu`, and the defaults would drag in
# the native ones. `fragile-send-sync-non-atomic-wasm` is what makes `wgpu::Device` satisfy
# `Backend: Send + Sync`, and it is sound only without `+atomics`, which is why the whole
# prover runs in one dedicated worker.
wgpu = { version = "30.0.1", default-features = false, features = [
    "wgsl",
    "webgpu",
    "std",
    "fragile-send-sync-non-atomic-wasm",
] }
# U13's `mod wasm`, all optional and all behind the `wasm` feature so that a plain
# `cargo build --target wasm32-unknown-unknown -p g16-wgpu` (which the CI wasm check runs)
# still compiles none of it.
#
# `=0.2.127` is an exact pin and it is not tidiness. wgpu's WebGPU backend vendors its own
# generated bindings against one wasm-bindgen version, and a skew fails **quietly** at
# `requestAdapter()` rather than at compile time: the adapter request resolves to nothing and
# the page reports "no wgpu adapter on this machine" on a Mac that plainly has one. The
# wasm-bindgen-cli that runs bindgen has to be the same version, which is why `build.sh`
# checks it rather than trusting whatever wasm-pack cached.
wasm-bindgen = { version = "=0.2.127", optional = true }
# `pub async fn` in a `#[wasm_bindgen]` block lowers to a JS Promise through this.
wasm-bindgen-futures = { version = "0.4", optional = true }
# `global()`, for a `crypto` handle that resolves in a Worker as well as a Window, and
# `Reflect::get` to read it.
js-sys = { version = "0.3", optional = true }
# `Crypto` only. wgpu already turns on the WorkerGlobalScope feature this build runs inside.
web-sys = { version = "0.3", optional = true, features = ["Crypto"] }
# A Rust panic in a Web Worker without this is `unreachable executed`, no message and no
# stack. It cost more time during U13 than any other single thing.
console_error_panic_hook = { version = "0.1", optional = true }

[features]
# The browser entry point. Off by default so a native build never pays for wasm-bindgen, and
# so `cargo test --workspace` does not resolve four crates it cannot use. Turned on by
# `crates/g16-wasm`, which is the cdylib wasm-pack is pointed at; this crate stays `rlib` for
# the reason `tests/manifest.rs` explains at length.
wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
]

[dev-dependencies]
# `flock`, for the cross-process GPU lock in tests/gpulock. `cargo test` runs each test
# binary as its own process, so the per-process Mutex the timing tests used could never have
# serialised them against each other. Test-only and never reaches wasm.
libc = "0.2"
# The NTT oracle. U6 checks the device transform against `g16_ntt::CpuNtt` elementwise, and
# that crate is deliberately not a runtime dependency: the production GPU path implements
# `compute_h` directly and never goes through `NttBackend`, because round-tripping every one
# of the six transforms across the host boundary is the thing this backend exists to avoid.
g16-ntt.workspace = true
num-bigint.workspace = true
num-traits = "0.2"
# `g16-msm`'s CPU Pippenger is the oracle U10's G2 MSM is checked against, elementwise, on
# every shape. Deliberately not a runtime dependency: the point of this backend is that the
# device does the MSM.
g16-msm.workspace = true
# g16-core (the stage 0 oracle and the artifact loader), g16-zkey and g16-field are all in
# [dependencies] now, and dev targets inherit those, so they are not repeated here.

# `pollster::block_on` compiles clean for wasm32 and then hangs the tab, because its executor
# is `thread::park` in a loop and the browser event loop never runs. It is confined to this
# table so it can never reach a wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "1.0.1"

# The limb-width sweep behind the field representation. Not a criterion bench:
# it prints a table and validates every variant against num-bigint, so it owns its own main.
# Run with `cargo bench -p g16-wgpu --bench limb_sweep`.
[[bench]]
name = "limb_sweep"
path = "benches/limb_sweep/main.rs"
harness = false
