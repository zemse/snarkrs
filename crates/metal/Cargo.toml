[package]
name = "snarkrs-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apple Metal backend for the snarkrs Groth16 prover"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
snarkrs-field.workspace = true
snarkrs-formats.workspace = true
snarkrs-groth16.workspace = true
# Direct because `ceremony` implements three of its traits. It was already here through
# snarkrs-groth16, and a transitive presence is not a version constraint.
snarkrs-msm.workspace = true
# Direct for the same reason: the FFT packs and unpacks its blocks on the pool. Already
# here through snarkrs-groth16.
rayon.workspace = true
# The GLV twiddle layout and decomposition, shared with snarkrs-cuda so the two FFT drivers
# feed their kernels bit-identical tables. Everything else in layout.rs stays this
# crate's own copy.
snarkrs-gpu-layout.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[dev-dependencies]
# `prove_with_blinders`, for the tests that compare proofs bit for bit at pinned blinders.
# Dev-only, so the feature never reaches a shipping build of this crate.
snarkrs-groth16 = { workspace = true, features = ["deterministic-blinders"] }
# The CPU reference the ceremony kernels are tested against: `prepare::point_times_fr`,
# `prepare::batch_to_affine` and `CpuKeyScale` are the implementations `--backend cpu`
# runs, and byte-identity with snarkjs rests on them. No cycle: snarkrs-ceremony does not
# depend on this crate. Path only, with no version, so `cargo publish` drops it: the two
# crates dev-depend on each other and one of them has to reach crates.io first.
snarkrs-ceremony = { path = "../ceremony" }

[features]
default = []

# Everything but `layout` is macOS only, so docs.rs's default Linux build shows an empty crate.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
