[package]
name = "g16-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "g16_cli"
path = "src/lib.rs"

[[bin]]
name = "g16"
path = "src/main.rs"

# Installs a global allocator, so it is a separate binary rather than a flag on `g16`.
# `required-features` means it is not even a compilation target without the feature, which
# is the strongest available guarantee that a benchmarked build never links dhat.
[[bin]]
name = "g16-dhat"
path = "src/bin/dhat.rs"
required-features = ["dhat-heap"]

# Same reasoning, for the same reason it exists: the README snippet proves against a GPU
# backend, so it cannot compile without one. Left ungated it is a compilation target under
# the default features, where `g16_metal` is not linked, and `cargo test --workspace` goes
# red on a tree with nothing wrong with it.
[[example]]
name = "readme_library_usage"
required-features = ["metal"]

[dependencies]
g16-field.workspace = true
g16-zkey.workspace = true
g16-core.workspace = true
g16-metal = { workspace = true, optional = true }
g16-cuda  = { workspace = true, optional = true }
g16-wgpu  = { workspace = true, optional = true }
ark-bn254.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
ark-serialize.workspace = true
# `getrandom` is ark-std's name for rand/std: without it there is no OS-seeded RNG in
# scope, and the zero-knowledge blinders have nowhere trustworthy to come from.
ark-std = { workspace = true, features = ["std", "getrandom"] }
clap.workspace = true
dhat = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
hex.workspace = true

[features]
# `wgpu` is on by default where `metal` and `cuda` are not, and the asymmetry is deliberate.
# Metal is macOS only and CUDA needs a driver, so both are opt in; the WebGPU backend is pure
# Rust, builds on macOS, Linux and Windows, and needs nothing installed. A machine with no
# GPU still builds the binary and gets an error from `--backend wgpu` at run time rather than
# a binary that cannot ask.
default = ["cpu", "wgpu"]
cpu = []
wgpu = ["dep:g16-wgpu"]
metal = ["dep:g16-metal"]
# `dep:g16-cuda` alone is not enough: g16-cuda gates its whole backend behind its own
# `cuda` feature so that a default macOS workspace build never pulls cudarc. Without
# forwarding the feature the crate compiles to an empty shell and `CudaBackend` is
# "configured out", which rustc reports as a missing item rather than a missing feature.
cuda = ["dep:g16-cuda", "g16-cuda/cuda"]
# Heap profiling. Off by default and optional, so `cargo build --release` neither links
# dhat nor builds the binary that would install its allocator.
dhat-heap = ["dep:dhat"]
