[package]
name = "g16-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "g16_cli"
path = "src/lib.rs"

[[bin]]
name = "g16"
path = "src/main.rs"

[dependencies]
g16-field.workspace = true
g16-zkey.workspace = true
g16-core.workspace = true
g16-metal = { workspace = true, optional = true }
g16-cuda  = { workspace = true, optional = true }
ark-bn254.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
ark-serialize.workspace = true
# `getrandom` is ark-std's name for rand/std: without it there is no OS-seeded RNG in
# scope, and the zero-knowledge blinders have nowhere trustworthy to come from.
ark-std = { workspace = true, features = ["std", "getrandom"] }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
hex.workspace = true

[features]
default = ["cpu"]
cpu = []
metal = ["dep:g16-metal"]
# `dep:g16-cuda` alone is not enough: g16-cuda gates its whole backend behind its own
# `cuda` feature so that a default macOS workspace build never pulls cudarc. Without
# forwarding the feature the crate compiles to an empty shell and `CudaBackend` is
# "configured out", which rustc reports as a missing item rather than a missing feature.
cuda = ["dep:g16-cuda", "g16-cuda/cuda"]
