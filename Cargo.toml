[workspace]
resolver = "2"
members = [
    "crates/g16-field",
    "crates/g16-zkey",
    "crates/g16-ntt",
    "crates/g16-msm",
    "crates/g16-core",
    "crates/g16-ceremony",
    "crates/g16-gpu-layout",
    "crates/g16-gpu-kernels",
    "crates/g16-metal",
    "crates/g16-cuda",
    "crates/g16-wgpu",
    "crates/g16-wasm",
    "crates/g16-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Soham Zemse <soham@zemse.in>"]
repository = "https://github.com/zemse/gpu-snark"

[workspace.dependencies]
ark-bn254    = { version = "0.5", default-features = false, features = ["curve"] }
# No `asm` here on purpose. A workspace dependency table cannot be target gated, and
# ark-ff's assembly is x86_64 only, so declaring it here made the manifest claim an
# optimisation that aarch64 and wasm32 never had. g16-field re-declares it under
# `cfg(target_arch = "x86_64")` and the read-this-first caveat lives there.
#
# Two things to keep in mind, and the second is measured rather than assumed. On aarch64
# the Montgomery multiply is generic Rust, which is part of why profiling ranks field
# arithmetic so high on the Mac. And ark-ff 0.5 also requires `target_feature = "bmi2"`
# and `"adx"` (montgomery_backend.rs:157-160), neither of which is in the baseline
# x86-64 target, and this repo sets no `target-cpu`, so the EC2 boxes were not running
# the assembly either. See the entry in TASKS.md before quoting any x86 CPU row.
ark-ff       = { version = "0.5", default-features = false }
ark-ec       = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std      = { version = "0.5", default-features = false }
rayon        = "1.10"
memmap2      = "0.9"
thiserror    = "2"
anyhow       = "1"
byteorder    = "1.5"
num-bigint   = "0.4"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
hex          = "0.4"

# The ceremony transcript, and nothing else in the workspace, needs these three. Every
# hash snarkjs takes in phase 1 and phase 2 is unkeyed BLAKE2b-512; the beacon derives its
# seed by iterating SHA-256; and ffjavascript's `ChaCha` is RFC 8439 ChaCha20 with a zero
# nonce, so `rand_chacha` serves once the seed words are byte-swapped (ffjavascript reads
# them big-endian per 32-bit word). See `transcript.rs` for the two calls that are NOT
# interoperable and must be hand-written on top of `next_u32`.
blake2       = "0.10"
sha2         = "0.10"
rand_chacha  = "0.3"

# Measurement only. None of these are reachable from a release build: dhat and
# hotpath sit behind cargo features that default off, criterion is a dev-dependency.
dhat         = "0.3"
hotpath      = "0.23"
criterion    = { version = "0.8", features = ["html_reports"] }

g16-field = { path = "crates/g16-field" }
g16-zkey  = { path = "crates/g16-zkey" }
g16-ntt   = { path = "crates/g16-ntt" }
g16-msm   = { path = "crates/g16-msm" }
g16-core  = { path = "crates/g16-core" }
g16-ceremony = { path = "crates/g16-ceremony" }
g16-gpu-layout = { path = "crates/g16-gpu-layout" }
g16-gpu-kernels = { path = "crates/g16-gpu-kernels" }
g16-metal = { path = "crates/g16-metal" }
g16-cuda  = { path = "crates/g16-cuda" }
g16-wgpu  = { path = "crates/g16-wgpu" }
g16-wasm  = { path = "crates/g16-wasm" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = 2
strip = false
