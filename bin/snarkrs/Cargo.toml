[package]
name = "snarkrs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "snarkrs_cli"
path = "src/lib.rs"

[[bin]]
name = "snarkrs"
path = "src/main.rs"

# Installs a global allocator, so it is a separate binary rather than a flag on `snarkrs`.
# `required-features` means it is not even a compilation target without the feature, which
# is the strongest available guarantee that a benchmarked build never links dhat.
[[bin]]
name = "snarkrs-dhat"
path = "src/bin/dhat.rs"
required-features = ["dhat-heap"]

[dependencies]
# The library facade, with everything the CLI runs. The GPU backends and the wasm witness
# calculator stay this crate's own features and forward to it.
snarkrs-lib = { workspace = true, features = ["ceremony", "witness"] }
snarkrs-field.workspace = true
snarkrs-formats.workspace = true
snarkrs-groth16.workspace = true
snarkrs-ceremony.workspace = true
snarkrs-msm.workspace = true
snarkrs-metal = { workspace = true, optional = true }
snarkrs-cuda  = { workspace = true, optional = true }
snarkrs-wgpu  = { workspace = true, optional = true }
ark-bn254.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
ark-serialize.workspace = true
# `getrandom` is ark-std's name for rand/std: without it there is no OS-seeded RNG in
# scope, and the zero-knowledge blinders have nowhere trustworthy to come from.
ark-std = { workspace = true, features = ["std", "getrandom"] }
clap.workspace = true
dhat = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
hex.workspace = true
# The native witness binary runner always; the wasm calculator behind `witness-wasm`.
snarkrs-witness.workspace = true

[dev-dependencies]
# `prove_with_blinders`, for the tests that compare proofs bit for bit at pinned blinders.
# Dev-only, so the feature never reaches a shipping build of this crate.
snarkrs-groth16 = { workspace = true, features = ["deterministic-blinders"] }

[features]
# `wgpu` is on by default where `metal` and `cuda` are not, and the asymmetry is deliberate.
# Metal is macOS only and CUDA needs a driver, so both are opt in; the WebGPU backend is pure
# Rust, builds on macOS, Linux and Windows, and needs nothing installed. A machine with no
# GPU still builds the binary and gets an error from `--backend wgpu` at run time rather than
# a binary that cannot ask.
default = ["cpu", "wgpu", "witness-wasm"]
cpu = []
wgpu = ["dep:snarkrs-wgpu", "snarkrs-lib/wgpu"]
metal = ["dep:snarkrs-metal", "snarkrs-lib/metal"]
# `dep:snarkrs-cuda` alone is not enough: snarkrs-cuda gates its whole backend behind its own
# `cuda` feature so that a default macOS workspace build never pulls cudarc. Without
# forwarding the feature the crate compiles to an empty shell and `CudaBackend` is
# "configured out", which rustc reports as a missing item rather than a missing feature.
cuda = ["dep:snarkrs-cuda", "snarkrs-cuda/cuda", "snarkrs-lib/cuda"]
# `wtns calculate` and `fullprove` on circom's circuit.wasm, through wasmtime. On by default
# because that is what snarkjs users have; off, the release binary is about 5 MB smaller
# and runs only circom's native witness binaries.
witness-wasm = ["snarkrs-witness/wasm", "snarkrs-lib/witness-wasm"]
# Heap profiling. Off by default and optional, so `cargo build --release` neither links
# dhat nor builds the binary that would install its allocator.
dhat-heap = ["dep:dhat"]

# setrlimit and prctl, so `prove` leaves no core file with the witness in it. Already in the
# tree; declared because this crate calls it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
