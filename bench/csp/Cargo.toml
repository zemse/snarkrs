# Outside the workspace on purpose. This crate links a C++ witness generator and pulls
# rand, sha3 and witnesscalc-adapter, none of which the prover has any business depending
# on, and its build clones and builds witnesscalc from source. Keeping it out means
# `cargo build --release` at the repo root is unaffected by any of that.
[package]
name = "snarkrs-csp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
snarkrs-groth16  = { path = "../../crates/groth16" }
snarkrs-formats  = { path = "../../crates/formats" }
snarkrs-field = { path = "../../crates/field" }
snarkrs-ceremony = { path = "../../crates/ceremony" }
snarkrs-metal = { path = "../../crates/metal", optional = true }
snarkrs-cuda  = { path = "../../crates/cuda", optional = true }

witnesscalc-adapter = "0.1"

# rand 0.8, not 0.9, and the pin is load bearing. The benchmark inputs are whatever
# `StdRng::seed_from_u64(n)` produces, and 0.9 replaced StdRng's ChaCha12 stream plumbing,
# so a bump here silently changes every message we hash.
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"

# 0.13 speaks rand_core 0.6, which is the one rand 0.8 implements, so the seeded StdRng
# goes straight into `SigningKey::random` and the benchmark signature stays reproducible.
k256 = "0.13"

ark-std = { version = "0.5", default-features = false, features = ["std", "getrandom"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"

[build-dependencies]
witnesscalc-adapter = "0.1"

[features]
default = []
metal = ["dep:snarkrs-metal"]
cuda = ["dep:snarkrs-cuda", "snarkrs-cuda/cuda"]

[[bin]]
name = "snarkrs-csp"
path = "src/bin/main.rs"

# Separate binary so that a peak-RSS sample is one process that does one proof and exits,
# which is what `/usr/bin/time -l` can actually measure. Anything the driver does before
# or after would land in the same maxrss.
[[bin]]
name = "snarkrs-csp-mem"
path = "src/bin/mem.rs"

# Witness generation on its own, so a profile of it is not also a profile of the prover.
[[bin]]
name = "snarkrs-csp-wit"
path = "src/bin/wit.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
